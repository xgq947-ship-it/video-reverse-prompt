name: Desktop Builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
            runtime_arch: arm64
            artifact: video-reverse-prompt-macos-arm64
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
            runtime_arch: x64
            artifact: video-reverse-prompt-windows-x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      VIDEO_REVERSE_PROMPT_RUNTIME_ARCH: ${{ matrix.runtime_arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'macos-15'
        run: rustup target add aarch64-apple-darwin
      - run: npm ci
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/sync-release-version.mjs
      - run: npm run check
      - run: npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Video Reverse Prompt $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
